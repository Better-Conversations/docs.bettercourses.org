# Deploy a new version

name: Build and Deploy

# Controls when the action will run. 
on:
  # Triggers the workflow on push or pull request events but only for the main branch
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Set permissions for the GITHUB_TOKEN
permissions:
  id-token: write
  contents: read
  pages: write

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  build:
    # Build the documentation in the container
    runs-on: ubuntu-latest
    container: ghcr.io/better-conversations/documentation-base-container:latest
    
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          
      # Configure Git safe directory
      - name: Configure Git safe directory
        shell: bash
        run: |
          git config --global --add safe.directory /__w/docs.bettercourses.org/docs.bettercourses.org

      # Detect local cache server (Squid proxy on 192.168.13.3:3128).
      # Silently skipped when unreachable (e.g. GitHub-hosted runners).
      - name: Detect cache server
        id: cache
        shell: bash
        run: |
          if python3 -c "import socket; socket.create_connection(('192.168.13.3', 3128), timeout=2).close()" 2>/dev/null; then
            echo "available=true" >> "$GITHUB_OUTPUT"
            echo "Cache server is reachable"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "Cache server not reachable – using direct downloads"
          fi

      - name: Configure cache proxies
        if: steps.cache.outputs.available == 'true'
        shell: bash
        run: |
          echo "http_proxy=http://192.168.13.3:3128"   >> "$GITHUB_ENV"
          echo "https_proxy=http://192.168.13.3:3128"  >> "$GITHUB_ENV"
          echo "HTTP_PROXY=http://192.168.13.3:3128"   >> "$GITHUB_ENV"
          echo "HTTPS_PROXY=http://192.168.13.3:3128"  >> "$GITHUB_ENV"

      - name: Install Sphinx
        shell: bash
        run: |
          uv venv
          source .venv/bin/activate
          uv python install 3.11
          uv python pin 3.11
          uv pip install -r requirements.txt

      - name: Build Sphinx site
        shell: bash
        run: |
          source .venv/bin/activate
          ls
          sh ./production_build.sh
      
      # This is GitHub Pages stuff which is not used anymore
      # - name: Setup Pages
      #   uses: actions/configure-pages@v5
        
      # - name: Upload build artifact
      #   uses: actions/upload-pages-artifact@v3
      #   with:
      #     path: build/html/

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: html-build
          path: build/html/
          retention-days: 1

      - name: Upload tmp directory
        uses: actions/upload-artifact@v4
        with:
          name: tmp-directory
          path: /tmp
          retention-days: 1

  # Deployment to github pages - don't use this, as there's a lot of Caddy redirects which are not supported by github pages
  # deploy:
  #   environment:
  #     name: github-pages
  #     url: ${{ steps.deployment.outputs.page_url }}
  #   runs-on: ubuntu-latest
  #   needs: build
  #   steps:
  #     - name: Deploy to GitHub Pages
  #       id: deployment
  #       uses: actions/deploy-pages@v4

# Old deployment to bcf-production-common via Tailscale
  deploy:
    # Deploy the built documentation
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: deploy
    
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: html-build
          path: build/html

      - name: Setup Tailscale
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TAILSCALE_CLIENT_ID }}
          oauth-secret: ${{ secrets.TAILSCALE_CLIENT_SECRET }}
          tags: tag:github-content    

      - name: Deploy Site
        run: |
          rsync \
            -e "ssh -o StrictHostKeyChecking=no -i ~/.ssh/id_rsa" \
            --delete -avv --progress --stats --itemize-changes \
            build/html/ bcf-web@100.66.190.17:/home/bcf-web/html/
