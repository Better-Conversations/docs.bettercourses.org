name: Claude PR Review

# Only triggered by @claude mentions in comments - no automatic reviews
# To request a review, comment "@claude please review this PR" on any PR
on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  claude-respond:
    if: |
      (github.event_name == 'issue_comment' || github.event_name == 'pull_request_review_comment') &&
      contains(github.event.comment.body, '@claude')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          track_progress: true
          direct_prompt: |
            This is a Sphinx documentation site for the Better Conversations Foundation.

            If asked to review the PR, use this checklist:

            ## Review Checklist

            ### 1. Content & Documentation Quality
            - [ ] Content is clear, accurate, and well-structured
            - [ ] RST/Markdown syntax is correct
            - [ ] Links are valid (internal and external)
            - [ ] Images have appropriate alt text
            - [ ] No spelling or grammar issues

            ### 2. Code Quality (for Python/config changes)
            - [ ] Code follows project conventions
            - [ ] No commented-out code without explanation
            - [ ] Meaningful variable/function names
            - [ ] No hardcoded values that should be configurable

            ### 3. Sphinx/Build Configuration
            - [ ] conf.py changes are appropriate
            - [ ] toctree structure is correct
            - [ ] No orphaned pages (pages not in any toctree)
            - [ ] Redirects are properly configured

            ### 4. Styling & CSS
            - [ ] CSS changes are scoped appropriately
            - [ ] No conflicting styles
            - [ ] Responsive design considerations
            - [ ] Accessibility (colour contrast, focus states)

            ### 5. Security & Best Practices
            - [ ] No credentials or secrets in code
            - [ ] External URLs use HTTPS
            - [ ] No unsafe HTML or JavaScript

            ### 6. CI/CD & Workflow Changes
            - [ ] GitHub Actions syntax is valid
            - [ ] Permissions are appropriately scoped
            - [ ] No security vulnerabilities in workflow

            ## Instructions for PR reviews
            1. First, view the PR diff using `gh pr diff`
            2. Analyze changes against the checklist above
            3. Use inline comments for specific issues
            4. Post a summary comment with overall findings and the completed checklist
            5. Be constructive - suggest improvements, don't just criticise
            6. Praise good practices when you see them

            Focus on substantive issues rather than nitpicking minor style preferences.

          claude_args: |
            --allowedTools "Read,Glob,Grep,mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
